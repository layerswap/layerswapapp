name: Bridge and widget — PR validation

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/bridge/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/bridge-widget-pr.yml"

permissions:
  contents: read

concurrency:
  group: bridge-widget-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Validate telemetry and widget contracts
        run: |
          pnpm --filter @layerswap/widget-types test
          pnpm --filter @layerswap/wallet-core test
          pnpm --filter @layerswap/wallet-evm test
          pnpm --filter @layerswap/wallet-starknet test
          pnpm --filter @layerswap/wallet-paradex test
          pnpm --filter @layerswap/wallet-stellar test
          # wallet-svm's pre-existing transaction-confirmation suite fails against the pinned
          # @solana/web3.js decoder (unrelated to error mapping); gate only the transfer-error contract.
          pnpm --filter @layerswap/wallet-svm exec node --experimental-strip-types --test tests/transfer-errors.test.mjs
          pnpm --filter @layerswap/wallet-fuel test
          pnpm --filter @layerswap/wallet-ton test
          pnpm --filter @layerswap/wallet-tron test
          pnpm --filter @layerswap/wallet-bitcoin test
          pnpm --filter @layerswap/widget check:types
          pnpm --filter @layerswap/bridge check:types
          pnpm --filter @layerswap/bridge test
          pnpm --filter @layerswap/widget test
