name: Grafana dashboards — PR validation

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/bridge/grafana/**"
      - ".github/workflows/grafana-dashboards-pr.yml"

permissions:
  contents: read

concurrency:
  group: grafana-dashboards-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          # This job installs no dependencies. Without this, setup-node v5 reads the
          # root packageManager field and fails because pnpm is not on PATH.
          package-manager-cache: false
      - name: Validate dashboard navigation and generated resources
        run: |
          node --test apps/bridge/grafana/tests/faro-dev-vertical-slice.test.mjs
          python3 apps/bridge/grafana/tests/native-trial.test.py
          python3 apps/bridge/grafana/build-native-trial.py
          python3 apps/bridge/grafana/build-issue-alerts.py
          git diff --exit-code -- apps/bridge/grafana/layerswap-faro-trial-*.json apps/bridge/grafana/faro-issue-alerts.paused.json
