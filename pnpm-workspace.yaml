packages:
  - packages/**
  - apps/*
  - examples/widget-react-host

catalog:
  '@tanstack/react-query': 5.90.11
  '@types/react': 19.2.3
  '@types/react-dom': 19.2.3
  '@wagmi/connectors': 5.7.7
  '@wagmi/core': 2.16.4
  '@walletconnect/ethereum-provider': 2.21.8
  '@walletconnect/universal-provider': 2.21.8
  '@walletconnect/types': 2.21.8
  '@walletconnect/utils': 2.21.8
  axios: 1.18.1
  react: 19.2.3
  react-dom: 19.2.3
  swr: ^2.2.5
  typescript: ^6.0.3
  viem: ^2.21.16
  wagmi: 2.14.11
  zustand: ^4.5.7
  starknet: ^8.5.2

# Forces a single resolved version of @types/react across the workspace.
# Without this, `apps/explorer` or any new package that requests React 18
# types can hoist a second copy alongside catalog's 19.2.3, and tsc's type
# resolution becomes order-dependent — the widget build on Vercel resolved
# the wrong copy (bigint not assignable to React 18's ReactNode). Override
# guarantees one version reaches tsc no matter what a dep declares.
overrides:
  '@types/react': 19.2.3
  '@types/react-dom': 19.2.3

# TypeScript 6 predates the peer ranges of two dev-time tools we still pin:
# @typescript-eslint 8.52 (via eslint-config-next) caps at <6.0.0 — fixed in
# 8.58+, which also needs eslint >=8.57 — and @module-federation/enhanced 0.9
# caps at ^5, only lifted in 2.7. Neither runs tsc against our sources, so the
# workspace accepts TS 6 for any typescript peer until those are upgraded.
peerDependencyRules:
  allowedVersions:
    typescript: '6'
